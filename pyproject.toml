[project]
name = "dns-manager"
version = "1.0.2"
description = "GUI per gestire i server DNS di sistema"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true